[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qdrishti"
version = "0.1.0"
description = "Q-Drishti: Enterprise Cryptographic Discovery & Analysis Tool with quantum risk scoring (SIH26164)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "cryptography>=42",
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
pqc = ["liboqs-python>=0.10"]

[project.scripts]
qdrishti = "qdrishti.cli:main"

[tool.setuptools.packages.find]
include = ["qdrishti*"]

[tool.setuptools.package-data]
qdrishti = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
