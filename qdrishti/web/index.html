<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q-Drishti</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div>
      <div class="wordmark">Q-Drishti</div>
      <div class="tagline">Cryptographic discovery &amp; quantum risk</div>
    </div>
  </div>
  <div class="topbar-actions">
    <label class="sr" for="scanPicker">Open a scan</label>
    <select id="scanPicker"></select>
    <button id="newScanBtn" class="btn accent">New scan</button>
  </div>
</header>

<main id="app"></main>

<aside id="drawer" class="drawer" hidden aria-label="Asset details">
  <div class="drawer-head">
    <button id="drawerClose" class="btn ghost" aria-label="Close details">Close</button>
  </div>
  <div id="drawerBody"></div>
</aside>
<div id="scrim" class="scrim" hidden></div>

<script src="app.js"></script>
</body>
</html>
