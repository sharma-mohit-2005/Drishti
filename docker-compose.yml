# Offline deployment: `docker compose up`, then open http://localhost:8765
# Put the code you want to scan in ./scan-target (mounted read-only at /scan).
services:
  qdrishti:
    build: .
    image: qdrishti:0.1.0
    ports: ["127.0.0.1:8765:8765"]
    volumes:
      - qdrishti-data:/data
      - ./scan-target:/scan:ro
volumes:
  qdrishti-data: {}
