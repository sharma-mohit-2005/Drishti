# Pilot vhost already moved to hybrid post-quantum key exchange (nginx built with OpenSSL 3.5).
server {
    listen 8443 ssl;
    server_name pilot.bharatfinserve.example;

    ssl_certificate     certs/server.crt;
    ssl_certificate_key certs/server.key;

    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768:X25519;
}
